services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: hackathon_sql
    ports:
      - "1433:1433" 
    restart: unless-stopped # Añadido para persistencia de la instancia
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Mathias!2024"
      MSSQL_PID: "Developer" # Edición explícita
    volumes:
      - sqlserver_data:/var/opt/mssql

volumes:
  sqlserver_data: